# LangSAM module configuration

module: langsam
description: "PV detection using GroundingDINO + SAM2 with text prompts and sub-tiling"

# GroundingDINO thresholds — strict for individual panel detection
box_threshold: 0.55
text_threshold: 0.45

# Sub-tiling configuration
# GroundingDINO resizes input to ~800px. Smaller tiles make panels
# relatively larger in the DINO input, improving detection.
subtile_size_px: 512
subtile_overlap_px: 64

# NMS IoU threshold for deduplicating overlapping detections
nms_iou_threshold: 0.3

# Area filters (m²) — individual PV panels are typically 1.5-2.5 m²
min_polygon_area_m2: 0.5
max_polygon_area_m2: 10.0

# Max fraction of tile area a single detection can occupy
# (individual panels are small relative to the tile)
max_tile_occupancy: 0.05

# Max aspect ratio (w/h or h/w) — panels are typically 1.7:1 ratio
max_aspect_ratio: 4.0

# Merge nearby polygons within this distance (meters)
# Keep small to preserve individual panels
merge_distance_m: 1.0

# Text prompts for individual PV panel detection (must end with ".")
# Singular, specific prompts to avoid detecting entire buildings/arrays.
prompts:
  - "one solar panel."
  - "single solar panel."
  - "individual photovoltaic module."
  - "one rooftop solar panel."
  - "one solar cell."

# Model cache location (relative to project root)
model_cache: sandbox/models/langsam
