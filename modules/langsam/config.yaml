# LangSAM module configuration

module: langsam
description: "PV detection using GroundingDINO + SAM2 with text prompts and sub-tiling"

# GroundingDINO thresholds (increased from 0.35/0.30 to reduce false positives)
box_threshold: 0.40
text_threshold: 0.30

# Sub-tiling configuration
# GroundingDINO resizes input to ~800px. With 800x800 sub-tiles,
# PV panels (4-8px in original) become ~6-12px in DINO input.
subtile_size_px: 1024
subtile_overlap_px: 128

# NMS IoU threshold for deduplicating overlapping detections
nms_iou_threshold: 0.5

# Area filters (m²) — reject noise and absurdly large detections
min_polygon_area_m2: 2.0
max_polygon_area_m2: 20000.0

# Max fraction of tile area a single detection can occupy
# (rejects football fields, large buildings, etc.)
max_tile_occupancy: 0.25

# Max aspect ratio (w/h or h/w) — rejects very elongated shapes
max_aspect_ratio: 8.0

# Merge nearby polygons within this distance (meters)
merge_distance_m: 3.0

# Text prompts for PV detection (must end with ".")
# Run each prompt separately to avoid cross-associations.
prompts:
  - "solar panel."
  - "photovoltaic panel."
  - "ground-mounted solar panel array."
  - "photovoltaic solar farm."
  - "rooftop solar panels."

# Model cache location (relative to project root)
model_cache: sandbox/models/langsam
