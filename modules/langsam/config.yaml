# LangSAM module configuration

module: langsam
description: "PV detection using GroundingDINO + SAM2 with text prompts"

# GroundingDINO parameters
box_threshold: 0.35
text_threshold: 0.3

# Area filters (m²)
min_polygon_area_m2: 1.0
max_polygon_area_m2: 50000.0

# Merge nearby polygons (meters)
merge_distance_m: 5.0

# Text prompts for PV detection (must end with ".")
prompts:
  - "solar panel."
  - "photovoltaic panel."
  - "PV installation."
  - "solar module."
  - "photovoltaic array."

# Model cache location (relative to project root)
model_cache: sandbox/models/langsam
