# CLIPSeg module configuration
module: clipseg
description: "PV detection using CLIPSeg (CIDAS/clipseg-rd64-refined)"

model_name: CIDAS/clipseg-rd64-refined

# Score threshold for CLIPSeg logits
score_threshold: 0.5

# Sub-tiling configuration
subtile_size_px: 288
subtile_overlap_px: 48

# NMS IoU threshold
nms_iou_threshold: 0.3

# Area filters (m²)
min_polygon_area_m2: 0.5
max_polygon_area_m2: 10.0

# Max tile occupancy fraction
max_tile_occupancy: 0.05

# Max aspect ratio
max_aspect_ratio: 4.0

# Merge distance (m)
merge_distance_m: 1.0

# Prompts
prompts:
  - "solar panel"
  - "photovoltaic panel"
  - "glass panel"
  - "black rectangle on roof"
